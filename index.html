<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4e7cd">
<title>Bubbleworks Harbor — Restaurant Tycoon</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>

  <!-- ---------------------------------------------------------------- HUD -->
  <div id="hud">

    <div class="corner top-left">
      <!-- coins and stars read together, so they share one plaque -->
      <div class="wallet">
        <span class="seg" id="chip-coins"><i class="ico ico-sand"></i><b data-bind="coins">300</b></span>
        <span class="seg" id="chip-stars"><i class="ico ico-star"></i><b data-bind="stars">0</b></span>
      </div>
      <span class="daytag" data-bind="phase">Day 1 · Prep</span>
    </div>

    <!--
      The side rail. Icons only, stacked down the right edge where a thumb
      already rests — a phone game's shortcut column. Every label lives in the
      panel it opens, so the rail stays a column of pictures and the room keeps
      the screen.
    -->
    <div class="corner top-right">
      <nav class="rail" id="rail">
        <button class="railbtn" id="btn-build" aria-label="Build" title="Build">
          <i class="ico ico-hammer"></i>
        </button>
        <button class="railbtn" id="btn-recipes" aria-label="Kitchen" title="Kitchen">
          <i class="ico ico-book"></i>
          <span class="badge hidden" data-bind="menu-badge">0</span>
        </button>
        <button class="railbtn" id="btn-pantry" aria-label="Inventory" title="Inventory">
          <i class="ico ico-crate"></i>
        </button>
        <button class="railbtn" id="btn-diary" aria-label="Guest Diary" title="Guest Diary">
          <i class="ico ico-diary"></i>
        </button>
        <button class="railbtn" id="btn-menu" aria-label="More" title="More">
          <i class="ico ico-star"></i>
          <span class="badge hidden" data-bind="research-badge">0</span>
        </button>
        <button class="railbtn railbtn-sm" id="btn-help" aria-label="How to play" title="How to play">
          <i class="ico ico-help"></i>
        </button>
      </nav>
    </div>

    <div class="zoneswitch" id="zoneswitch">
      <button data-zone="restaurant" class="on">Restaurant</button>
      <button data-zone="factory">Factory</button>
    </div>

    <!--
      One bar along the bottom. Everything the game can open is a single tap
      from here — the old layout buried half of it behind a Menu sheet, which
      meant two taps to reach the thing you open most.
    -->
    <div id="bottombar">
      <div class="barrow">
        <!-- flyers: printed of a morning, handed out at the door once open -->
        <button class="flyer" id="btn-flyer" title="Print a flyer">
          <i class="ico ico-flyer"></i>
          <span class="flyer-body">
            <b id="flyer-count">0/8</b>
            <span class="flyer-bar"><i id="flyer-fill"></i></span>
          </span>
        </button>
        <span class="barspace"></span>
        <button class="round round-sm" id="btn-sound" title="Sound"><i class="ico ico-sound"></i></button>
        <button class="pill pill-go" id="btn-service">Open!</button>
      </div>
    </div>

    <!--
      The service readout, and under it what is actually left on the menu — the
      number that decides when the day ends, so it is the one on screen.
    -->
    <div class="servicebar hidden" id="servicebar">
      <div class="sb-row">
        <span class="sb-label">Served</span>
        <b data-bind="served">0</b>
        <span class="sb-sep"></span>
        <span class="sb-label">Earned</span>
        <b data-bind="earned">0</b>
        <span class="sb-sep"></span>
        <span class="sb-label">Left</span>
        <b data-bind="stock">0</b>
      </div>
      <div class="sb-menu" id="sb-menu"></div>
    </div>

    <div id="titlecard" class="titlecard hidden">
      <b id="titlecard-main">Day 1</b>
      <span id="titlecard-sub">Doors open</span>
    </div>

    <div id="toasts"></div>
    <div id="hint" class="hint hidden"></div>

    <!--
      The blueprint strip. While something is on the cursor this is the only
      control that matters, so it says what is being set down, which way it
      faces, and how to turn it.
    -->
    <div id="placebar" class="placebar hidden">
      <span class="plan-mark"></span>
      <span class="plan-text">
        <b id="placebar-title">Piece</b>
        <span id="placebar-label">Tap a tile to place</span>
      </span>
      <span class="turns" id="placebar-turns" aria-hidden="true">
        <i></i><i></i><i></i><i></i>
      </span>
      <button class="pill pill-sm pill-sun" id="placebar-rotate">Turn</button>
      <button class="pill pill-sm pill-quiet" id="placebar-done">Done</button>
    </div>
  </div>

  <!-- ------------------------------------------------------------- sheets -->
  <div id="scrim" class="hidden"></div>
  <div id="sheet" class="sheet grain hidden" role="dialog" aria-modal="true">
    <header class="sheet-head">
      <div class="sheet-grip"></div>
      <h2 id="sheet-title">Panel</h2>
      <button class="round round-sm" id="sheet-close" aria-label="Close"><i class="ico ico-x"></i></button>
    </header>
    <div class="sheet-tabs" id="sheet-tabs"></div>
    <div class="sheet-body" id="sheet-body"></div>
    <footer class="sheet-foot hidden" id="sheet-foot"></footer>
  </div>

  <div id="boot" class="boot">
    <div class="boot-card">
      <div class="boot-logo">
        <span class="bl-1">Bubbleworks</span>
        <span class="bl-2">Harbor</span>
      </div>
      <div class="boot-bar"><i id="boot-fill"></i></div>
      <p id="boot-msg">Filling the tanks…</p>
      <button id="boot-retry" class="pill pill-sun hidden" type="button">Reload</button>
    </div>
  </div>
</div>

<!--
  Boot guard. A module that fails to resolve — a half-cached file graph after a
  rename, a blocked request — throws before main() ever runs, so nothing inside
  the module can report it and the loading screen would sit there forever. This
  is inline on purpose: it cannot itself be the file that failed to arrive.
-->
<script>
(function () {
  var msg = document.getElementById('boot-msg');
  var retry = document.getElementById('boot-retry');
  var shown = false;

  function stuck(text) {
    if (shown || window.game) return;
    shown = true;
    msg.textContent = text;
    msg.style.color = '#b8481c';
    retry.classList.remove('hidden');
  }

  // a hard reload past the cache, since a stale file is the usual cause
  retry.onclick = function () {
    var u = location.href.replace(/[?&]r=\d+/, '');
    location.replace(u + (u.indexOf('?') < 0 ? '?' : '&') + 'r=' + Date.now());
  };

  window.addEventListener('error', function (e) {
    if (e.target && e.target !== window && e.target.tagName === 'SCRIPT') {
      stuck('Could not load the game files. Try reloading.');
    }
  }, true);

  window.setTimeout(function () {
    stuck('This is taking longer than it should. Try reloading.');
  }, 15000);
}());
</script>
<script type="module" src="src/main.js"></script>
<noscript><p style="padding:2rem;font:16px system-ui">This game needs JavaScript enabled.</p></noscript>
</body>
</html>
