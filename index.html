<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#dfe9ef">
<title>Bubbleworks Harbor — Restaurant Tycoon</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>

  <!-- ---------------------------------------------------------------- HUD -->
  <div id="hud">

    <div class="corner top-left">
      <!-- coins and stars read together, so they share one plaque -->
      <div class="wallet">
        <span class="seg" id="chip-coins"><i class="ico ico-sand"></i><b data-bind="coins">300</b></span>
      </div>
      <!--
        Rank, day and the fame you have banked toward the next rung, in one
        strip. Three separate readouts used to say what this says. Tapping it
        opens the ladder.
      -->
      <button class="rankchip" id="chip-rank" title="Fame">
        <span class="rank-row">
          <b data-bind="rank">Driftwood Shack</b>
          <span class="seg" id="chip-stars"><i class="ico ico-star"></i><b data-bind="stars">0</b></span>
          <span class="rank-day" data-bind="phase">Day 1 · Prep</span>
        </span>
        <span class="rank-bar"><i id="rank-fill"></i></span>
      </button>
      <!-- the standing job, right under the day, where it cannot be missed -->
      <button id="quest" class="quest hidden" title="Jobs">
        <span class="quest-art" id="quest-art"></span>
        <span class="quest-body">
          <span class="quest-top">
            <b id="quest-title">—</b>
            <span class="quest-n" id="quest-n"></span>
          </span>
          <span class="quest-bar"><i id="quest-fill"></i></span>
          <span class="quest-hint" id="quest-hint"></span>
        </span>
        <span class="quest-pay" id="quest-pay"></span>
      </button>
    </div>

    <!--
      The side rail. Icons only, stacked down the right edge where a thumb
      already rests — a phone game's shortcut column. Every label lives in the
      panel it opens, so the rail stays a column of pictures and the room keeps
      the screen.
    -->
    <div class="corner top-right">
      <nav class="rail" id="rail">
        <button class="railbtn" id="btn-build" aria-label="Build" title="Build">
          <i class="ico ico-hammer"></i>
        </button>
        <button class="railbtn" id="btn-recipes" aria-label="Kitchen" title="Kitchen">
          <i class="ico ico-book"></i>
          <span class="badge hidden" data-bind="menu-badge">0</span>
        </button>
        <button class="railbtn" id="btn-pantry" aria-label="Inventory" title="Inventory">
          <i class="ico ico-crate"></i>
        </button>
        <button class="railbtn" id="btn-diary" aria-label="Guest Diary" title="Guest Diary">
          <i class="ico ico-diary"></i>
        </button>
        <button class="railbtn" id="btn-menu" aria-label="Settings" title="Settings">
          <i class="ico ico-tools"></i>
          <span class="badge hidden" data-bind="research-badge">0</span>
        </button>
        <button class="railbtn" id="btn-quests" aria-label="Jobs" title="Jobs">
          <i class="ico ico-help"></i>
          <span class="badge hidden" data-bind="quest-badge">0</span>
        </button>
      </nav>
    </div>

    <div class="zoneswitch" id="zoneswitch">
      <button data-zone="restaurant" class="on">Restaurant</button>
      <button data-zone="factory">Factory</button>
    </div>

    <!--
      One bar along the bottom, and one button on it.

      The morning has exactly one job — decide what is going on the menu — so
      the bar says that and nothing else. Opening the doors is the last thing
      you do inside the kitchen book, next to the plating you just finished,
      rather than a separate button out here that only ever meant "am I done".
      Once the doors are open the same slot becomes the way to shut them.
    -->
    <div id="bottombar">
      <div class="barrow">
        <!-- the board out front. Only there while the doors are open -->
        <button class="flyer hidden" id="btn-flyer" title="Call somebody in">
          <i class="ico ico-flyer"></i>
          <span class="flyer-body">
            <b id="flyer-count">0/8</b>
            <span class="flyer-bar"><i id="flyer-fill"></i></span>
          </span>
        </button>
        <span class="barspace"></span>
        <button class="round round-sm" id="btn-sound" title="Sound"><i class="ico ico-sound"></i></button>
        <button class="pill pill-go" id="btn-service">Arrange Menu</button>
      </div>
    </div>

    <!--
      Service is a different room to be in, so it looks like one: the sign over
      the door turns round, the readout comes up under it, and the whole HUD
      changes colour underneath (#hud.serving). Prep is white paper; a shift is
      deep blue with the lights on.
    -->
    <div class="servicebar hidden" id="servicebar">
      <div class="sb-sign"><b>OPEN</b><span id="sb-day">Day 1</span></div>
      <div class="sb-row">
        <span class="sb-label">Served</span>
        <b data-bind="served">0</b>
        <span class="sb-sep"></span>
        <span class="sb-label">Earned</span>
        <b data-bind="earned">0</b>
        <span class="sb-sep"></span>
        <span class="sb-label">Left</span>
        <b data-bind="stock">0</b>
      </div>
      <div class="sb-menu" id="sb-menu"></div>
    </div>

    <div id="titlecard" class="titlecard hidden">
      <b id="titlecard-main">Day 1</b>
      <span id="titlecard-sub">Doors open</span>
    </div>

    <div id="toasts"></div>
    <div id="hint" class="hint hidden"></div>

    <!--
      The blueprint strip. While something is on the cursor this is the only
      control that matters, so it says what is being set down, which way it
      faces, and how to turn it.
    -->
    <div id="placebar" class="placebar hidden">
      <span class="plan-mark"></span>
      <span class="plan-text">
        <b id="placebar-title">Piece</b>
        <span id="placebar-label">Tap a tile to place</span>
      </span>
      <span class="turns" id="placebar-turns" aria-hidden="true">
        <i></i><i></i><i></i><i></i>
      </span>
      <button class="pill pill-sm pill-sun" id="placebar-rotate">Turn</button>
      <button class="pill pill-sm pill-quiet" id="placebar-done">Done</button>
    </div>
  </div>

  <!-- ------------------------------------------------------------- sheets -->
  <div id="scrim" class="hidden"></div>
  <div id="sheet" class="sheet grain hidden" role="dialog" aria-modal="true">
    <header class="sheet-head">
      <div class="sheet-grip"></div>
      <h2 id="sheet-title">Panel</h2>
      <button class="round round-sm" id="sheet-close" aria-label="Close"><i class="ico ico-x"></i></button>
    </header>
    <div class="sheet-tabs" id="sheet-tabs"></div>
    <div class="sheet-body" id="sheet-body"></div>
    <footer class="sheet-foot hidden" id="sheet-foot"></footer>
  </div>

  <!--
    The main menu. It sits over the restaurant rather than over a picture of
    one: the camera drifts across your own dining room behind it, so the first
    thing the game shows you is the place you have been building.
  -->
  <div id="title" class="title hidden">
    <div class="title-wash"></div>
    <!--
      No name, no tagline, no numbers. The room behind is the game's face; two
      hand-drawn signs hang over it and that is the whole menu.
    -->
    <div class="title-card">
      <button class="sign sign-go" id="title-play">
        <span class="sign-pin"></span>
        <span class="sign-text">Enter Restaurant</span>
      </button>
      <button class="sign sign-sun" id="title-load">
        <span class="sign-pin"></span>
        <span class="sign-text">Load Save</span>
      </button>
      <p class="title-by">made by <b>Pukking Dragon</b></p>
    </div>
  </div>

  <!--
    An aside. The same chef, over live play: no bars, no camera, and the HUD
    stays exactly where it is. A cutscene that takes the screen away while you
    are holding three plates is a punishment, so anything he wants to say while
    the doors are open he says from down here.
  -->
  <div id="aside" class="aside hidden">
    <div class="aside-face"></div>
    <div class="aside-body">
      <b class="aside-who" id="aside-who">Tako</b>
      <p class="aside-text" id="aside-text"></p>
    </div>
  </div>

  <!-- a cutscene: bars in, camera moves, the chef says his piece -->
  <div id="scene" class="scene hidden">
    <div class="scene-veil"></div>
    <div class="bar-top"></div>
    <div class="bar-bot"></div>
    <!-- he walks on rather than appearing in a box -->
    <div class="scene-cast"><div class="say-face" id="say-face"></div></div>
    <div class="say" id="say">
      <b class="say-who" id="say-who">Chef</b>
      <p class="say-text" id="say-text"></p>
      <span class="say-next" id="say-next"></span>
    </div>
  </div>


  <!-- the guide's spotlight and its speech bubble, anchored per step -->
  <div id="tutor" class="tutor hidden">
    <div class="tutor-hole" id="tutor-hole"></div>
    <div class="tutor-say" id="tutor-say">
      <!-- the guide is the chef, not an anonymous voice -->
      <div class="tutor-face" id="tutor-face"></div>
      <b id="tutor-title">Step</b>
      <span id="tutor-text">…</span>
      <div class="tutor-foot">
        <span class="tutor-dots" id="tutor-dots"></span>
        <button class="pill pill-sm pill-quiet" id="tutor-skip">Skip</button>
      </div>
    </div>
  </div>

  <!--
    The loading screen. Drawn, not branded: a pot on a stove, bubbles coming
    off it, and a hand-ruled gauge. No name — you have not been let in yet.
  -->
  <!--
    The loading screen, and a game to play while you wait: Tako at the pot with
    a spatula, and ingredients dropping in. Tap the pot to stir. It has no
    bearing on anything, which is exactly why it can be there — a loading bar
    you are allowed to play with stops being a loading bar.
  -->
  <div id="boot" class="boot">
    <!--
      The scene, back to front. Every layer here is drawn in CSS rather than
      loaded, because this is the screen that is up *while* the art loads — if
      it needed a picture to look like anything it would be a blank rectangle
      for the first second, which is exactly the second that matters.
    -->
    <div class="boot-sun"></div>
    <div class="boot-gulls"><i></i><i></i></div>
    <div class="boot-sea">
      <span class="boot-wave w1"></span>
      <span class="boot-wave w2"></span>
      <span class="boot-wave w3"></span>
    </div>
    <div class="boot-sky"></div>
    <!-- bunting across the top, because a harbour has bunting -->
    <div class="boot-flags"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

    <div class="boot-card">
      <div class="boot-scene" id="boot-scene">
        <div class="boot-drops" id="boot-drops"></div>
        <div class="boot-chef"><span class="boot-shadow"></span></div>
        <div class="boot-pot" id="boot-pot">
          <span class="boot-shadow"></span>
          <span class="boot-steam s1"></span>
          <span class="boot-steam s2"></span>
          <span class="boot-steam s3"></span>
          <span class="boot-pan"></span>
          <!-- the hand goes round; the blade tips with it. That is a stir. -->
          <span class="boot-hand"><span class="boot-spat" id="boot-spat"></span></span>
        </div>
      </div>
      <div class="boot-deck"></div>
      <!-- the plaque nailed to the jetty: the counter, the gauge, the word -->
      <div class="boot-plate">
        <div class="boot-stir">
          <span id="boot-combo" class="boot-combo"></span>
          <span class="boot-tap" id="boot-tap">tap the pot to stir</span>
        </div>
        <div class="boot-bar"><i id="boot-fill"></i><b id="boot-pct">0%</b></div>
        <p id="boot-msg">Filling the tanks…</p>
        <button id="boot-retry" class="pill pill-sun hidden" type="button">Reload</button>
      </div>
    </div>
  </div>
</div>

<!--
  Boot guard. A module that fails to resolve — a half-cached file graph after a
  rename, a blocked request — throws before main() ever runs, so nothing inside
  the module can report it and the loading screen would sit there forever. This
  is inline on purpose: it cannot itself be the file that failed to arrive.
-->
<script>
(function () {
  var msg = document.getElementById('boot-msg');
  var retry = document.getElementById('boot-retry');
  var shown = false;

  function stuck(text) {
    if (shown || window.game) return;
    shown = true;
    msg.textContent = text;
    msg.style.color = '#2a64aa';
    retry.classList.remove('hidden');
  }

  // a hard reload past the cache, since a stale file is the usual cause
  retry.onclick = function () {
    var u = location.href.replace(/[?&]r=\d+/, '');
    location.replace(u + (u.indexOf('?') < 0 ? '?' : '&') + 'r=' + Date.now());
  };

  window.addEventListener('error', function (e) {
    if (e.target && e.target !== window && e.target.tagName === 'SCRIPT') {
      stuck('Could not load the game files. Try reloading.');
    }
  }, true);

  window.setTimeout(function () {
    stuck('This is taking longer than it should. Try reloading.');
  }, 15000);
}());
</script>
<script type="module" src="src/main.js"></script>
<noscript><p style="padding:2rem;font:16px system-ui">This game needs JavaScript enabled.</p></noscript>
</body>
</html>
